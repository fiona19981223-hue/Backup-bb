<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CLASSIFIED · 生日任務</title>
<style>
:root{--bg:#0b0f14;--bg2:#121a24;--g:#39ff88;--g2:#9affc4;--red:#ff4d5e;--txt:#d9fbe8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body,button,.tile,.mv,#stage{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 20% 0,#13202c,var(--bg));color:var(--txt);font-family:"SF Mono",ui-monospace,Menlo,"PingFang HK","Noto Sans TC",monospace;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:18px 16px calc(60px + env(safe-area-inset-bottom))}
.tag{display:inline-block;border:1px solid var(--red);color:var(--red);padding:2px 8px;font-size:11px;letter-spacing:2px;transform:rotate(-2deg)}
h1{font-size:24px;margin:12px 0 4px;color:var(--g);letter-spacing:1px}
h2{font-size:17px;margin:0 0 8px;color:var(--g2)}
.sub{opacity:.7;font-size:13px}
.box{background:var(--bg2);border:1px solid #1f3a2c;border-radius:10px;padding:16px;margin:14px 0}
.btn{display:block;width:100%;min-height:48px;padding:14px;border:1px solid var(--g);border-radius:8px;background:rgba(57,255,136,.12);color:var(--g);font-weight:700;font-size:15px;margin-top:12px;letter-spacing:1px;font-family:inherit}
.btn:active{background:rgba(57,255,136,.3)}
.btn.ghost{border-color:#2a4a38;color:#7fb596;background:transparent;font-weight:400}
.btn.red{border-color:var(--red);color:var(--red);background:rgba(255,77,94,.1)}
input[type=text]{width:100%;padding:13px;border-radius:8px;border:1px solid #2a4a38;background:#0a1118;color:var(--g);font-size:18px;text-align:center;font-family:inherit}
.code-row{display:flex;gap:8px;justify-content:center;margin:12px 0}
.cell{width:54px;height:64px;border:1px solid #2a4a38;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--g);background:#0a1118}
.cell.on{border-color:var(--g);box-shadow:0 0 10px rgba(57,255,136,.4)}
.progress{display:flex;gap:5px;margin:10px 0}
.progress i{flex:1;height:5px;border-radius:3px;background:#1f3a2c}
.progress i.on{background:var(--g);box-shadow:0 0 8px var(--g)}
.typed{white-space:pre-wrap;line-height:1.7;font-size:15px;min-height:50px}
.intel{border-left:3px solid var(--g);padding:8px 12px;margin-top:10px;background:rgba(57,255,136,.07);white-space:pre-wrap;line-height:1.7}
.hint{font-size:13px;margin-top:8px;padding:8px 10px;border-left:3px solid #e8c14a;background:rgba(232,193,74,.08)}
.msg{min-height:20px;margin-top:8px;font-size:13px;color:var(--red)}
input[type=range]{width:100%;accent-color:#39ff88;height:32px;margin-top:16px}
.pct{font-size:54px;font-weight:800;text-align:center;color:var(--g)}
.row{display:flex;justify-content:space-between;font-size:12px;opacity:.7}
.img{width:100%;aspect-ratio:4/3;border-radius:12px;background:linear-gradient(135deg,#39ff8830,#ffffff10);display:flex;align-items:center;justify-content:center;font-size:72px;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover}
.amt{font-size:30px;font-weight:800;color:var(--g);margin:6px 0}
.fade{animation:f .6s ease both}
@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.small{font-size:11px;opacity:.5;margin-top:12px}
#stage{position:relative;margin:14px 0;border:1px dashed #2a4a38;border-radius:12px;touch-action:none;overflow:hidden;background:rgba(255,255,255,.02);-webkit-user-select:none;user-select:none}
.tile{position:absolute;border:1px solid rgba(57,255,136,.6);touch-action:none;cursor:grab;z-index:3;box-shadow:0 3px 6px rgba(0,0,0,.5);background-repeat:no-repeat;transform:rotate(var(--r,0deg));transition:transform .2s ease}
.tile.drag{cursor:grabbing;z-index:5;transform:rotate(var(--r,0deg)) scale(1.06)}
.tile.gray{filter:grayscale(1) contrast(1.05)}
.tile.gray.reveal{filter:none;transition:filter 1s ease}
.opt{text-align:left;font-weight:400;letter-spacing:0}
.opt.sel{border-color:var(--g);background:rgba(57,255,136,.18);color:var(--g);font-weight:700}
.tile.ok{z-index:1;pointer-events:none;border-color:transparent;box-shadow:none}
.slot{position:absolute;border:1px dashed rgba(57,255,136,.3);z-index:0}
.mv{position:absolute;touch-action:none;cursor:grab;z-index:3;background-repeat:no-repeat}
.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
</style>
</head>

function check(input, answers){
  const v = norm(input); if(!v) return false;
  if(v===norm(SKIP_CODE)) return true;
  const digits = (v.match(/\d+/g)||[]).join("");
  return answers.some(a=>{
    const k = norm(a);
    if(/^\d+$/.test(k)) return digits===k;
    return k && v.includes(k);
  });

const rnd=(lo,hi)=>lo+Math.random()*(hi-lo);
function trayOrder(total, perRow, spread){
  const cheb=(a,b)=>Math.max(Math.abs(a%perRow-b%perRow),Math.abs(Math.floor(a/perRow)-Math.floor(b/perRow)));
  let a, tries=0;
  while(true){
    a=[...Array(total).keys()];
    for(let i=total-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    tries++;
    if(a.some((v,k)=>v===k)) continue;
    if(tries<2000 && spread && spread.length>1){
      const pos=spread.map(idx=>a.indexOf(idx)); let ok=true;
      for(let i=0;i<pos.length&&ok;i++) for(let j=i+1;j<pos.length;j++) if(cheb(pos[i],pos[j])<2){ok=false;break;}
      if(!ok) continue;
    }
    return a;
  }
}
function makePuzzle(st, url, cols, rows, cw, ch, done, spread, gray, rotate){
  st.innerHTML="";
  const sw = st.clientWidth || 440, bx = Math.max(0,(sw-cols*cw)/2), by = 8, total = cols*rows;
  const perRow = Math.max(1, Math.floor((sw-8)/(cw+10)));
  const gapX = perRow>1 ? Math.min(46,(sw-8-perRow*cw)/(perRow-1)) : 0, gapY = rotate ? Math.max(24, cw-ch+8) : 24;
  const trayY = by+rows*ch+22+(rotate?(cw-ch)/2:0), trows = Math.ceil(total/perRow);
  st.style.height = (trayY + trows*(ch+gapY) + 6) + "px";
  for(let i=0;i<total;i++){
    const s=document.createElement("div"); s.className="slot";
    s.style.cssText="left:"+(bx+(i%cols)*cw)+"px;top:"+(by+Math.floor(i/cols)*ch)+"px;width:"+cw+"px;height:"+ch+"px";
    st.appendChild(s);
  }
  const order=trayOrder(total, perRow, spread);
  let placed=0;
  order.forEach((idx,k)=>{
    const r=Math.floor(idx/cols), c=idx%cols, p=document.createElement("div");
    p.className="tile"+(gray?" gray":"");
    const gx = 4+(k%perRow)*(cw+gapX)+rnd(-4,4), gy = trayY+Math.floor(k/perRow)*(ch+gapY)+rnd(-4,4);
    p.style.cssText="width:"+cw+"px;height:"+ch+"px;background-image:"+url+";background-repeat:no-repeat;background-size:"+(cols*cw)+"px "+(rows*ch)+"px;background-position:-"+(c*cw)+"px -"+(r*ch)+"px;left:"+Math.max(0,gx)+"px;top:"+gy+"px";
    let drag=false, ox=0, oy=0, locked=false, sx=0, sy=0, moved=0, turn=0;
    const rot=()=>((turn%4)+4)%4;
    const setRot=()=>p.style.setProperty("--r",(turn*90)+"deg");
    if(rotate){ turn=Math.floor(Math.random()*4); setRot(); }
    const pad=()=> (rot()%2)?(cw-ch)/2:0;
    const lock=()=>{ if(locked) return; locked=true; turn+=(4-rot())%4; setRot(); p.style.left=(bx+c*cw)+"px"; p.style.top=(by+r*ch)+"px"; p.classList.add("ok"); placed++;
      if(placed===total){ if(gray) st.querySelectorAll(".tile").forEach(t=>t.classList.add("reveal")); setTimeout(done, gray?1300:350); } };
    p._lock=lock;
    const inPlace=()=> rot()===0 && Math.abs(parseFloat(p.style.left)-(bx+c*cw))<cw*0.4 && Math.abs(parseFloat(p.style.top)-(by+r*ch))<Math.max(ch*0.5,18);
    p.addEventListener("pointerdown",e=>{ if(locked) return; drag=true; moved=0; sx=e.clientX; sy=e.clientY; p.classList.add("drag"); p.setPointerCapture(e.pointerId);
      const s=st.getBoundingClientRect(); ox=e.clientX-s.left-parseFloat(p.style.left); oy=e.clientY-s.top-parseFloat(p.style.top); });
    p.addEventListener("pointermove",e=>{ if(!drag) return; moved=Math.max(moved,Math.hypot(e.clientX-sx,e.clientY-sy)); if(rotate && moved<6) return; const s=st.getBoundingClientRect(), pd=pad();
      p.style.left=Math.max(0,Math.min(s.width-cw,e.clientX-s.left-ox))+"px"; p.style.top=Math.max(pd,Math.min(s.height-ch-pd,e.clientY-s.top-oy))+"px"; });
    const end=()=>{ if(!drag) return; drag=false; p.classList.remove("drag");
      if(rotate && moved<6){ turn+=1; setRot(); }
      if(inPlace()) lock(); };
    p.addEventListener("pointerup",end); p.addEventListener("pointercancel",end);
    st.appendChild(p);
  });
  return ()=>{ st.querySelectorAll(".tile").forEach(t=>t._lock&&t._lock()); };
}

  $("#rs").onclick=()=>{ if(confirm("重新開始會清除所有進度（包括已獲得嘅密碼數字），確定嗎？")){

    S={step:-1,phase:"q",wrong:0,digits:[],result:null,hn:0,sel:-1}; save(); location.hash=""; render(); } };
}
function render(){
  if(location.hash==="#final") return final();
  if(S.step===-1) return intro();
  if(S.step===-0.5) puzzle();
  else if(S.step>=STEPS.length) vault();
  else stepView();
  addReset();
}
window.addEventListener("hashchange", render);
render();
</script>
